<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EUTOPIA Lisboa Microclimate & Health Risk Monitor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--primary:#007bff;--dark:#0056b3;--bg:#f4f6f9;--border:#dee2e6}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#212529;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{background:#1e293b;color:#fff;padding:10px 16px;z-index:1100}
header h1{margin:0;font-size:1.1rem} header span{font-size:.75rem;color:#94a3b8}
#main{display:flex;flex-direction:column;flex:1;overflow:hidden}
#map-wrapper{position:relative;flex:1;min-height:42vh}
#map{height:100%;width:100%}
.leaflet-image-layer{image-rendering:auto}
#top-bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;background:rgba(255,255,255,.95);padding:4px 6px;border-radius:24px;box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;gap:4px;max-width:94vw;overflow-x:auto}
.mode-btn{border:none;background:transparent;color:#4b5563;padding:6px 11px;border-radius:18px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap}
.mode-btn.active{background:var(--primary);color:#fff}
#controls{background:#fff;padding:14px 16px;overflow-y:auto;border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.1);z-index:1005;max-height:50vh}
.row{display:flex;gap:10px;margin-bottom:10px;align-items:center}.flex-1{flex:1}
.btn{background:var(--primary);color:#fff;border:none;padding:9px 14px;border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;min-height:38px}
.btn:hover{background:var(--dark)}.btn-secondary{background:#64748b}
label{font-weight:600;font-size:.8rem;color:#334155;display:block;margin-bottom:3px}
select,input[type=number]{width:100%;padding:7px 10px;border-radius:6px;border:1px solid var(--border);font-size:.85rem;background:#fff}
.card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin:10px 0;font-size:.8rem}
.card h3{margin:0 0 6px;font-size:.8rem;color:#334155}
#legend .bar{height:10px;border-radius:5px;margin:4px 0}
#legend .lab{display:flex;justify-content:space-between;font-size:.72rem;font-weight:600}
#readout table{width:100%;border-collapse:collapse}
#readout td{padding:2px 0}#readout td:last-child{text-align:right;font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
#reco ul{margin:4px 0 0;padding-left:18px}#reco li{margin-bottom:4px}
#timeline .tl{display:grid;grid-template-columns:90px repeat(24,1fr);gap:1px;align-items:center;margin-bottom:3px;font-size:.68rem}
#timeline .c{height:10px;background:#e2e8f0}.c.on.h{background:#e74c3c}.c.on.m{background:#007bff}.c.now{outline:2px solid #1e293b;z-index:1}
#settings-panel{display:none}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
#status-bar{font-size:.72rem;color:#64748b;background:#f1f5f9;padding:6px 10px;border-radius:6px;margin-top:8px}
@media(min-width:768px){#main{flex-direction:row}#controls{width:400px;max-height:100%;border-radius:0}}
</style>
</head>
<body>
<header><h1>EUTOPIA Lisboa</h1><span>Microclimate Environmental & Health Risk</span></header>
<div id="main">
  <div id="map-wrapper">
    <div id="top-bar">
      <button class="mode-btn active" onclick="setMode('risk',this)">Risk Index</button>
      <button class="mode-btn" onclick="setMode('temp',this)">Heat °C</button>
      <button class="mode-btn" onclick="setMode('noise',this)">Noise dB</button>
      <button class="mode-btn" onclick="setMode('pm25',this)">PM2.5</button>
      <button class="mode-btn" onclick="setMode('uv',this)">UV</button>
    </div>
    <div id="map"></div>
  </div>
  <div id="controls">
    <div class="row">
      <button id="playBtn" class="btn" onclick="togglePlay()">▶ Play</button>
      <div class="flex-1"><label for="date">Date</label><select id="date" onchange="loadDay()"></select></div>
      <button class="btn btn-secondary" onclick="toggleSettings()">⚙</button>
    </div>
    <div style="display:flex;justify-content:space-between"><label for="hour">Time of day</label><b id="hourVal" style="color:var(--primary)">15:00</b></div>
    <input type="range" id="hour" min="0" max="23" value="15" style="width:100%" oninput="updateFrame()">
    <div id="timeline"></div>
    <div id="legend" class="card"></div>
    <label for="persona">Vulnerability profile</label>
    <select id="persona" onchange="renderFrame()">
      <option value="elderly">Senior / Cardiovascular (Heat 50%, UV 20%)</option>
      <option value="asthma">Asthma / Respiratory (PM2.5 60%, Heat 20%)</option>
      <option value="general">General public (balanced)</option>
    </select>
    <div id="readout" class="card"><h3>📍 Tap the map to inspect a location</h3></div>
    <div id="reco" class="card" style="display:none"></div>
    <div id="settings-panel" class="card">
      <label style="color:var(--primary)">Risk thresholds (safe → danger)</label>
      <div class="grid-2"><div><label>Heat safe °C</label><input type="number" id="t_safe" value="22" onchange="updateSettings()"></div><div><label>Heat danger °C</label><input type="number" id="t_danger" value="30" onchange="updateSettings()"></div></div>
      <div class="grid-2"><div><label>Noise safe dB</label><input type="number" id="n_safe" value="55" onchange="updateSettings()"></div><div><label>Noise danger dB</label><input type="number" id="n_danger" value="75" onchange="updateSettings()"></div></div>
      <div class="grid-2"><div><label>PM2.5 safe µg/m³</label><input type="number" id="p_safe" value="12" onchange="updateSettings()"></div><div><label>PM2.5 danger µg/m³</label><input type="number" id="p_danger" value="35" onchange="updateSettings()"></div></div>
      <div class="grid-2"><div><label>UV safe</label><input type="number" id="u_safe" value="3" onchange="updateSettings()"></div><div><label>UV danger</label><input type="number" id="u_danger" value="8" onchange="updateSettings()"></div></div>
    </div>
    <div id="status-bar">Initializing…</div>
  </div>
</div>

<script>
const DATA = './www/data/';

const map = L.map('map').setView([38.7369,-9.1426],12);
L.tileLayer(`https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_408g_1_95cc032f14a947b30ef77c0a`,
  {attribution:'&copy; OpenStreetMap contributors &copy; CARTO',maxZoom:20}).addTo(map);
const eventGroup = L.layerGroup().addTo(map);
let overlay=null, day=null, mode='risk', sel=null, selMarker=null, playing=null, fitted=false;

const TH = {temp:{safe:22,danger:30},noise:{safe:55,danger:75},pm25:{safe:12,danger:35},uv:{safe:3,danger:8}};
const W = {elderly:{temp:.5,pm25:.15,noise:.15,uv:.2},asthma:{temp:.2,pm25:.6,noise:.1,uv:.1},general:{temp:.25,pm25:.25,noise:.25,uv:.25}};
const HAZ = {temp:['Heat','°C','#e67e22'],noise:['Noise','dB','#8e44ad'],pm25:['PM2.5','µg/m³','#7f8c8d'],uv:['UV','','#f1c40f']};
const RAMPS = {
  risk :{lo:0,hi:1,unit:'risk',stops:[[46,204,113],[243,156,18],[231,76,60]]},
  temp :{lo:15,hi:40,unit:'°C',stops:[[49,130,189],[255,237,160],[253,141,60],[189,0,38]]},
  noise:{lo:35,hi:85,unit:'dB',stops:[[242,240,247],[188,189,220],[128,125,186],[84,39,143],[63,0,125]]},
  pm25 :{lo:0,hi:60,unit:'µg/m³',stops:[[255,247,188],[254,196,79],[217,95,14],[153,52,4],[80,20,0]]},
  uv   :{lo:0,hi:11,unit:'UV index',stops:[[46,204,113],[241,196,15],[230,126,34],[231,76,60],[142,68,173]]}
};
const $ = id => document.getElementById(id);
const status = m => $('status-bar').innerText = m;

function rampColor(t, stops){
  t = Math.max(0,Math.min(1,t)); const p=t*(stops.length-1), i=Math.min(Math.floor(p),stops.length-2), f=p-i;
  return stops[i].map((v,k)=>Math.round(v+(stops[i+1][k]-v)*f));
}
function risk(v,s,d){ return (v==null||isNaN(v))?0 : v<=s?0 : v>=d?1 : (v-s)/(d-s); }
function cellRisks(h,i){ const r={}; for(const k in TH) r[k]=risk(h[k]?h[k][i]:null,TH[k].safe,TH[k].danger); return r; }
function score(r){ const w=W[$('persona').value]; return r.temp*w.temp+r.noise*w.noise+r.pm25*w.pm25+r.uv*w.uv; }
function hourObj(h){ return day && day.hours && day.hours[String(h)]; }
function hav(a,b,c,d){ const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b); const x=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }

// ---------- startup: manifest ----------
async function init(){
  try{
    const m = await (await fetch(DATA+'manifest.json')).json();
    m.dates.forEach(d=>{ const o=document.createElement('option'); o.value=o.innerText=d; $('date').appendChild(o); });
    const today = new Date().toISOString().slice(0,10);
    if(m.dates.includes(today)) $('date').value = today;
    setLegend(); loadDay();
  }catch(e){ status('Could not load manifest.json: '+e.message); }
}
async function loadDay(){
  const d=$('date').value; if(!d) return;
  status('Loading '+d+' …');
  try{ day = await (await fetch(DATA+d+'.json')).json(); fitted||(map.fitBounds(bounds()),fitted=true); updateFrame(); }
  catch(e){ status('Error loading '+d+': '+e.message); }
}
function bounds(){ const [w,s,e,n]=day?day.bbox:[-9.3,38.6,-9,38.85]; return [[s,w],[n,e]]; }

// ---------- UI ----------
function setMode(m,btn){ mode=m; document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); setLegend(); renderFrame(); }
function toggleSettings(){ const p=$('settings-panel'); p.style.display=p.style.display==='block'?'none':'block'; }
function updateSettings(){
  [['temp','t'],['noise','n'],['pm25','p'],['uv','u']].forEach(([k,p])=>{ TH[k].safe=parseFloat($(p+'_safe').value); TH[k].danger=parseFloat($(p+'_danger').value); });
  renderFrame();
}
function setLegend(){
  const r=RAMPS[mode], g=r.stops.map((c,i)=>`rgb(${c}) ${i/(r.stops.length-1)*100}%`).join(',');
  const lab = mode==='risk' ? ['Low','Moderate','High'] : [r.lo,Math.round((r.lo+r.hi)/2),r.hi+'+'];
  $('legend').innerHTML = `<div class="lab"><span>${mode==='risk'?'Combined risk (profile-weighted)':HAZ[mode][0]+' ('+r.unit+')'}</span></div>
    <div class="bar" style="background:linear-gradient(90deg,${g})"></div>
    <div class="lab">${lab.map(x=>`<span>${x}</span>`).join('')}</div>`;
}
function togglePlay(){
  if(playing){ clearInterval(playing); playing=null; $('playBtn').innerText='▶ Play'; return; }
  $('playBtn').innerText='⏸ Pause';
  playing=setInterval(()=>{ $('hour').value=(parseInt($('hour').value)+1)%24; updateFrame(); },400);
}
function updateFrame(){
  const h=$('hour').value; $('hourVal').innerText=String(h).padStart(2,'0')+':00';
  renderFrame(); renderEvents(h); renderTimeline(h);
}

// ---------- raster overlay ----------
function renderFrame(){
  if(!day) return;
  const h=hourObj($('hour').value);
  if(!h||!h.temp){ status('No data for this hour'); if(overlay){map.removeLayer(overlay);overlay=null;} return; }
  const {rows,cols}=day, N=rows*cols, R=RAMPS[mode];
  const cv=document.createElement('canvas'); cv.width=cols; cv.height=rows;
  const ctx=cv.getContext('2d'), img=ctx.createImageData(cols,rows);
  for(let i=0;i<N;i++){
    let t, ok=true;
    if(mode==='risk'){ t=score(cellRisks(h,i)); ok=t>0.02; }
    else { const v=h[mode][i]; if(v==null){ok=false;t=0;} else t=(v-R.lo)/(R.hi-R.lo); }
    const c=rampColor(t,R.stops), k=i*4;
    img.data[k]=c[0]; img.data[k+1]=c[1]; img.data[k+2]=c[2]; img.data[k+3]=ok?165:0;
  }
  ctx.putImageData(img,0,0);
  if(overlay) map.removeLayer(overlay);
  overlay=L.imageOverlay(cv.toDataURL(),bounds(),{opacity:.85,interactive:false}).addTo(map);
  overlay.bringToBack();
  status(`${day.date} ${$('hourVal').innerText} | grid ${cols}×${rows} | meteo ${h.meteo.temp}°C, PM2.5 ${h.meteo.pm25}, UV ${h.meteo.uv}`);
  if(sel) inspect(sel.lat,sel.lng,true);
}

// ---------- events ----------
function renderEvents(hour){
  eventGroup.clearLayers();
  const h=hourObj(hour); if(!h) return;
  const act=h.active_events||{};
  Object.keys(act).forEach(id=>{
    const ev=act[id], full=(day.events||{})[id]||{}, mit=ev.type==='mitigation';
    const color=mit?'#007bff':'#e74c3c', icon=mit?'❄️':'🔥';
    (full.footprints||[]).forEach(fp=>{ if(fp.type==='Polygon')
      L.geoJSON({type:'Feature',geometry:fp},{style:{color,weight:2,dashArray:'5 4',fillOpacity:.12},interactive:false}).addTo(eventGroup); });
    const popup=`<strong>${icon} ${ev.label}</strong><br>${mit?'Cooling / mitigation':'Hazard event'}<br>Affects: ${[].concat(ev.risks).join(', ')}<br>Influence radius ≈ ${ev.d0_m} m<br>${(full.start||'').replace('T',' ')} → ${(full.end||'').replace('T',' ')}`;
    ev.coords.forEach(c=>{
      const ll=[c[1],c[0]];
      L.circle(ll,{radius:ev.d0_m,color,weight:1,fillOpacity:.06,interactive:false}).addTo(eventGroup);
      L.circleMarker(ll,{radius:9,fillColor:color,color:'#fff',weight:2,fillOpacity:.95}).bindPopup(popup).bindTooltip(icon+' '+ev.label).addTo(eventGroup);
    });
  });
}
function renderTimeline(hour){
  if(!day||!day.events){ $('timeline').innerHTML=''; return; }
  let html='';
  Object.keys(day.events).forEach(id=>{
    const ev=day.events[id], cls=ev.type==='mitigation'?'m':'h';
    html+=`<div class="tl"><span title="${ev.label}">${ev.label.length>14?ev.label.slice(0,13)+'…':ev.label}</span>`;
    for(let h=0;h<24;h++){ const on=hourObj(h)&&hourObj(h).active_events&&hourObj(h).active_events[id];
      html+=`<div class="c ${on?'on '+cls:''} ${h==hour?'now':''}"></div>`; }
    html+='</div>';
  });
  $('timeline').innerHTML=html;
}

// ---------- click inspection + recommendations ----------
map.on('click',e=>inspect(e.latlng.lat,e.latlng.lng,false));
function cellIndex(lat,lng){
  const [w,s,e,n]=day.bbox; if(lng<w||lng>e||lat<s||lat>n) return -1;
  const c=Math.min(day.cols-1,Math.floor((lng-w)/(e-w)*day.cols)), r=Math.min(day.rows-1,Math.floor((n-lat)/(n-s)*day.rows));
  return r*day.cols+c;
}
function inspect(lat,lng,quiet){
  if(!day) return;
  const i=cellIndex(lat,lng), hr=$('hour').value, h=hourObj(hr);
  if(i<0||!h||h.temp[i]==null){ if(!quiet) $('readout').innerHTML='<h3>📍 Outside the modelled area</h3>'; return; }
  sel={lat,lng};
  if(selMarker) map.removeLayer(selMarker);
  selMarker=L.marker([lat,lng]).addTo(map);
  const r=cellRisks(h,i), w=W[$('persona').value], sc=score(r);
  const top=Object.keys(r).sort((a,b)=>r[b]*w[b]-r[a]*w[a])[0];
  const rows=Object.keys(HAZ).map(k=>`<tr><td><span class="dot" style="background:${HAZ[k][2]}"></span>${HAZ[k][0]}</td><td>${h[k][i]==null?'–':h[k][i]} ${HAZ[k][1]}</td></tr>`).join('');
  $('readout').innerHTML=`<h3>📍 ${lat.toFixed(4)}, ${lng.toFixed(4)} · ${$('hourVal').innerText}</h3><table>${rows}</table>
    <div style="margin-top:6px"><b>Risk for this profile: ${Math.round(sc*100)}%</b>${sc>0.02?` · main driver: ${HAZ[top][0]}`:''}</div>
    ${chart(i,hr)}`;
  reco(lat,lng,h,r,i);
}
function series(i){ const s=[]; for(let h=0;h<24;h++){ const o=hourObj(h); s.push(o&&o.temp&&o.temp[i]!=null?score(cellRisks(o,i)):null); } return s; }
function chart(i,hr){
  const s=series(i), W_=288, H_=50;
  const pts=s.map((v,h)=>v==null?null:`${(h/23*W_).toFixed(1)},${(H_-4-v*(H_-8)).toFixed(1)}`).filter(Boolean).join(' ');
  let best=null; s.forEach((v,h)=>{ if(v!=null&&h>=7&&h<=22&&(best===null||v<s[best])) best=h; });
  return `<svg viewBox="0 0 ${W_} ${H_}" style="width:100%;margin-top:6px;background:#fff;border:1px solid #e2e8f0;border-radius:6px">
    <polyline points="${pts}" fill="none" stroke="#e74c3c" stroke-width="2"/>
    <line x1="${hr/23*W_}" x2="${hr/23*W_}" y1="0" y2="${H_}" stroke="#1e293b" stroke-dasharray="3"/></svg>
    <div style="font-size:.72rem;color:#64748b">Risk over 24 h here · best hour outdoors (07–22): <b>${best==null?'n/a':String(best).padStart(2,'0')+':00'}</b></div>`;
}
function reco(lat,lng,h,r,i){
  const tips=[], persona=$('persona').value, hr=parseInt($('hour').value);
  if(r.temp>.5) tips.push(`🌡️ Heat ${h.temp[i]}°C: avoid strenuous activity, drink water${persona==='elderly'?', check on relatives':''}.`);
  if(r.pm25>.5) tips.push(`😷 PM2.5 ${h.pm25[i]} µg/m³: ${persona==='asthma'?'carry your inhaler, ':''}avoid main roads, keep windows closed.`);
  if(r.noise>.5) tips.push(`🔊 Noise ${h.noise[i]} dB: prefer quieter side streets; use ear protection near events.`);
  if(r.uv>.5) tips.push(`☀️ UV ${h.uv[i]}: sunscreen, hat, seek shade.`);
  // nearest active cooling site
  let near=null;
  Object.values(h.active_events||{}).forEach(ev=>{
    ev.coords.forEach(c=>{ const d=hav(lat,lng,c[1],c[0]);
      if(ev.type==='mitigation'){ if(!near||d<near.d) near={d,ev}; }
      else if(d<ev.d0_m*1.5) tips.push(`⚠️ Near <b>${ev.label}</b> (${Math.round(d)} m): expect elevated ${[].concat(ev.risks).join(' & ')}.`); });
  });
  if(near&&(r.temp>.2)){
    let end=hr; while(hourObj(end+1)&&hourObj(end+1).active_events&&hourObj(end+1).active_events[near.ev.id]) end++;
    tips.push(`❄️ Nearest cooling zone: <b>${near.ev.label}</b>, ${Math.round(near.d)} m away, open until ${String(end+1).padStart(2,'0')}:00.`);
  }
  if(!tips.length) tips.push('✅ Conditions are fine for normal outdoor activity.');
  $('reco').style.display='block';
  $('reco').innerHTML='<h3>What should I do now?</h3><ul>'+tips.map(t=>`<li>${t}</li>`).join('')+'</ul>';
}

init();
</script>
</body>
</html>

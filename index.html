<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EUTOPIA Lisboa Microclimate & Health Risk Monitor</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Proj4js for EPSG:3763 (Lisbon Local Meters) -> WGS84 Lat/Lng -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

  <style>
    :root {
      --primary: #007bff;
      --primary-dark: #0056b3;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #212529;
      --border: #dee2e6;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #1e293b;
      color: white;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 1100;
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 700; }
    header span { font-size: 0.75rem; color: #94a3b8; }

    #main-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #map-wrapper {
      position: relative;
      flex: 1;
      min-height: 45vh;
      width: 100%;
      background: #e5e7eb;
    }

    #map { height: 100%; width: 100%; }

    #top-bar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(4px);
      padding: 4px 6px;
      border-radius: 24px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      display: flex;
      gap: 4px;
      max-width: 92vw;
      overflow-x: auto;
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: #4b5563;
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 6px rgba(0, 123, 255, 0.3);
    }

    #controls {
      background: var(--card-bg);
      padding: 14px 16px;
      overflow-y: auto;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
      z-index: 1005;
      max-height: 45vh;
    }

    .row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
    .flex-1 { flex: 1; }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      min-height: 38px;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn-secondary { background: #64748b; }

    label { font-weight: 600; font-size: 0.8rem; color: #334155; display: block; margin-bottom: 3px; }
    select, input[type="number"] {
      width: 100%;
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      background: #fff;
    }

    #legend {
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin: 8px 0 12px 0;
      padding: 8px 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-box { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

    #settings-panel {
      display: none;
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      margin-top: 8px;
      border: 1px solid #e2e8f0;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }

    /* Diagnostic Status Footer */
    #status-bar {
      font-size: 0.72rem;
      color: #64748b;
      background: #f1f5f9;
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 8px;
      word-break: break-all;
    }

    @media (min-width: 768px) {
      #main-container { flex-direction: row; }
      #map-wrapper { flex: 1; height: 100%; }
      #controls { width: 380px; max-height: 100%; border-radius: 0; }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>EUTOPIA Lisboa</h1>
      <span>Microclimate Environmental & Health Risk</span>
    </div>
  </header>

  <div id="main-container">
    <div id="map-wrapper">
      <div id="top-bar">
        <button class="mode-btn active" onclick="setMapLayer('risk', this)">Risk Index</button>
        <button class="mode-btn" onclick="setMapLayer('temp', this)">Temp (°C)</button>
        <button class="mode-btn" onclick="setMapLayer('noise', this)">Noise (dB)</button>
        <button class="mode-btn" onclick="setMapLayer('pm25', this)">PM2.5</button>
        <button class="mode-btn" onclick="setMapLayer('uv', this)">UV Index</button>
      </div>
      <div id="map"></div>
    </div>

    <div id="controls">
      <div class="row">
        <button id="playBtn" class="btn" onclick="togglePlay()">▶ Play 24h</button>
        <div class="flex-1">
          <label for="date">Select Date</label>
          <select id="date" onchange="loadDailyData()">
            <option value="">Detecting JSON files...</option>
          </select>
        </div>
        <button class="btn btn-secondary" onclick="toggleSettings()">⚙ Limits</button>
      </div>

      <div style="margin-bottom: 10px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label for="hour">Time of Day</label>
          <span id="hourVal" style="color: var(--primary); font-weight: bold; font-size: 0.9rem;">15:00</span>
        </div>
        <input type="range" id="hour" min="0" max="23" value="15" style="width:100%; margin-top:4px;" oninput="updateFrame()">
      </div>

      <div id="legend">
        <div class="legend-item"><span class="legend-box" style="background:#2ecc71;"></span> Safe</div>
        <div class="legend-item"><span class="legend-box" style="background:#f39c12;"></span> Moderate</div>
        <div class="legend-item"><span class="legend-box" style="background:#e74c3c;"></span> High Risk</div>
      </div>

      <div>
        <label for="persona">Vulnerability Profile</label>
        <select id="persona" onchange="renderFrame()">
          <option value="elderly">Senior / Cardiovascular (Heat 50%, UV 20%)</option>
          <option value="asthma">Asthma / Respiratory (PM2.5 60%, Temp 20%)</option>
          <option value="general">General Public (Balanced Weights)</option>
        </select>
      </div>

      <div id="settings-panel">
        <label style="color: var(--primary); margin-bottom: 6px;">Hazard Thresholds (Safe → Danger)</label>
        
        <div class="grid-2">
          <div>
            <label for="t_safe">Temp Safe (°C)</label>
            <input type="number" id="t_safe" value="22" onchange="updateSettings()">
          </div>
          <div>
            <label for="t_danger">Temp Danger (°C)</label>
            <input type="number" id="t_danger" value="30" onchange="updateSettings()">
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label for="n_safe">Noise Safe (dB)</label>
            <input type="number" id="n_safe" value="55" onchange="updateSettings()">
          </div>
          <div>
            <label for="n_danger">Noise Danger (dB)</label>
            <input type="number" id="n_danger" value="75" onchange="updateSettings()">
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label for="p_safe">PM2.5 Safe (µg/m³)</label>
            <input type="number" id="p_safe" value="12" onchange="updateSettings()">
          </div>
          <div>
            <label for="p_danger">PM2.5 Danger (µg/m³)</label>
            <input type="number" id="p_danger" value="35" onchange="updateSettings()">
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label for="u_safe">UV Safe Index</label>
            <input type="number" id="u_safe" value="3" onchange="updateSettings()">
          </div>
          <div>
            <label for="u_danger">UV Danger Index</label>
            <input type="number" id="u_danger" value="8" onchange="updateSettings()">
          </div>
        </div>
      </div>

      <!-- Diagnostic Status Bar -->
      <div id="status-bar">Status: Initializing...</div>
    </div>
  </div>

  <script>
    // Register EPSG:3763 (PT-TM06 / ETRS89 Lisbon local meter projection)
    proj4.defs("EPSG:3763", "+proj=tmerc +lat_0=39.66825833333333 +lon_0=-8.133108333333333 +k=1 +x_0=0 +y_0=0 +ellps=GRS80 +units=m +no_defs");

    // Initialize Map
    const map = L.map('map').setView([38.7369, -9.1426], 12);

    L.tileLayer(
      `https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_408g_1_95cc032f14a947b30ef77c0a`,
      { attribution: '&copy; OpenStreetMap contributors &copy; CARTO', maxZoom: 20 }
    ).addTo(map);

    let canvasLayer = null;
    let eventMarkersGroup = L.layerGroup().addTo(map);

    let currentDailyData = null;
    let isPlaying = false;
    let playInterval = null;
    let activeMode = 'risk';

    let thresholds = {
      temp:  { safe: 22, danger: 30 },
      noise: { safe: 55, danger: 75 },
      pm25:  { safe: 12, danger: 35 },
      uv:    { safe: 3,  danger: 8 }
    };

    const weights = {
      elderly: { temp: 0.50, pm25: 0.15, noise: 0.15, uv: 0.20 },
      asthma:  { temp: 0.20, pm25: 0.60, noise: 0.10, uv: 0.10 },
      general: { temp: 0.25, pm25: 0.25, noise: 0.25, uv: 0.25 }
    };

    function updateStatus(msg) {
      document.getElementById('status-bar').innerText = msg;
    }

    // Helper 1: Universal Array Field Resolver (Flattens matrices or picks key variants)
    function getArrayField(obj, possibleKeys) {
      if (!obj) return null;
      for (let key of possibleKeys) {
        if (obj[key] !== undefined && obj[key] !== null) {
          let val = obj[key];
          if (Array.isArray(val)) {
            return Array.isArray(val[0]) ? val.flat() : val;
          }
        }
      }
      return null;
    }

    // Helper 2: Universal Hour Object Resolver
    function getHourData(data, hourVal) {
      if (!data) return null;
      let hObj = null;
      if (data.hours) {
        hObj = data.hours[hourVal] || data.hours[String(hourVal)] || data.hours[parseInt(hourVal)];
      } else if (data.data) {
        hObj = data.data[hourVal] || data.data[String(hourVal)];
      } else {
        hObj = data[hourVal] || data[String(hourVal)];
      }
      return hObj;
    }

    // Helper 3: Universal Bounding Box Resolver & Reprojection
    function parseBounds(bbox) {
      if (!bbox) return null;
      let a, b, c, d;
      if (Array.isArray(bbox)) {
        [a, b, c, d] = bbox;
      } else if (typeof bbox === 'object') {
        a = bbox.xmin || bbox.left || bbox.minlon;
        b = bbox.ymin || bbox.bottom || bbox.minlat;
        c = bbox.xmax || bbox.right || bbox.maxlon;
        d = bbox.ymax || bbox.top || bbox.maxlat;
      }

      if (a === undefined) return null;

      // Case 1: Projected meters (e.g. EPSG:3763) -> Reproject to WGS84
      if (Math.abs(a) > 180 || Math.abs(b) > 180) {
        const p1 = proj4("EPSG:3763", "EPSG:4326", [a, b]); // [lon, lat]
        const p2 = proj4("EPSG:3763", "EPSG:4326", [c, d]); // [lon, lat]
        return [[Math.min(p1[1], p2[1]), Math.min(p1[0], p2[0])], 
                [Math.max(p1[1], p2[1]), Math.max(p1[0], p2[0])]];
      }

      // Case 2: WGS84 Lat/Lng
      const lats = [a, b, c, d].filter(v => v > 0 && v < 90);
      const lons = [a, b, c, d].filter(v => v < 0 && v > -180);

      if (lats.length >= 2 && lons.length >= 2) {
        return [[Math.min(...lats), Math.min(...lons)], [Math.max(...lats), Math.max(...lons)]];
      }

      return [[Math.min(a, c), Math.min(b, d)], [Math.max(a, c), Math.max(b, d)]];
    }

    // Auto-discover available date JSON files
    async function discoverAndPopulateDates() {
      const select = document.getElementById('date');
      select.innerHTML = '';

      const candidates = [
        '2026-09-27', '2026-09-28', '2026-09-29', '2026-09-30',
        '2026-10-01', '2026-10-02', '2026-10-03', '2026-10-04'
      ];

      const validDates = [];
      for (const dateStr of candidates) {
        try {
          const res = await fetch(`./www/data/${dateStr}.json`);
          if (res.ok) validDates.push(dateStr);
        } catch (e) {}
      }

      const dateList = validDates.length > 0 ? validDates : ['2026-09-28', '2026-09-29', '2026-09-30'];

      dateList.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.innerText = d;
        select.appendChild(opt);
      });

      loadDailyData();
    }

    // Load Daily JSON
    async function loadDailyData() {
      const date = document.getElementById('date').value;
      if (!date) return;

      try {
        updateStatus(`Loading ./www/data/${date}.json ...`);
        const res = await fetch(`./www/data/${date}.json`);
        currentDailyData = await res.json();
        
        updateFrame();
      } catch (e) {
        updateStatus(`Error loading ${date}.json: ${e.message}`);
        console.error(e);
      } 
    }

    function setMapLayer(mode, btnElem) {
      activeMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      if(btnElem) btnElem.classList.add('active');
      renderFrame();
    }

    function toggleSettings() {
      const panel = document.getElementById('settings-panel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function updateSettings() {
      thresholds.temp.safe   = parseFloat(document.getElementById('t_safe').value);
      thresholds.temp.danger = parseFloat(document.getElementById('t_danger').value);
      thresholds.noise.safe   = parseFloat(document.getElementById('n_safe').value);
      thresholds.noise.danger = parseFloat(document.getElementById('n_danger').value);
      thresholds.pm25.safe   = parseFloat(document.getElementById('p_safe').value);
      thresholds.pm25.danger = parseFloat(document.getElementById('p_danger').value);
      thresholds.uv.safe     = parseFloat(document.getElementById('u_safe').value);
      thresholds.uv.danger   = parseFloat(document.getElementById('u_danger').value);
      renderFrame();
    }

    function updateFrame() {
      const hour = document.getElementById('hour').value;
      document.getElementById('hourVal').innerText = (hour < 10 ? '0' : '') + hour + ':00';
      renderFrame();
      renderActiveEventMarkers(hour);
    }

    function calcRisk(val, safe, danger) {
      if (val === undefined || val === null || isNaN(val)) return 0.0;
      if (val <= safe) return 0.0;
      if (val >= danger) return 1.0;
      return (val - safe) / (danger - safe);
    }

    // Render Canvas Overlay
    function renderFrame() {
      if (!currentDailyData) return;

      const hour = document.getElementById('hour').value;
      const persona = document.getElementById('persona').value;
      const w = weights[persona];
      
      const hourData = getHourData(currentDailyData, hour);

      if (!hourData) {
        updateStatus(`No data found for hour ${hour}`);
        return;
      }

      // Extract hazard arrays
      const arrTemp  = getArrayField(hourData, ['temp', 'temperature', 't', 't2m']);
      const arrNoise = getArrayField(hourData, ['noise', 'noise_db', 'n', 'db']);
      const arrPM25  = getArrayField(hourData, ['pm25', 'pm2_5', 'pm', 'p']);
      const arrUV    = getArrayField(hourData, ['uv', 'uv_index', 'uvi', 'u']);

      if (!arrTemp) {
        updateStatus(`Hour ${hour}: Missing temp array in JSON`);
        return;
      }

      const N = arrTemp.length;
      const displayValues = new Float32Array(N);

      for (let i = 0; i < N; i++) {
        const rTemp  = calcRisk(arrTemp[i], thresholds.temp.safe, thresholds.temp.danger);
        const rNoise = calcRisk(arrNoise ? arrNoise[i] : 0, thresholds.noise.safe, thresholds.noise.danger);
        const rPM25  = calcRisk(arrPM25 ? arrPM25[i] : 0, thresholds.pm25.safe, thresholds.pm25.danger);
        const rUV    = calcRisk(arrUV ? arrUV[i] : 0, thresholds.uv.safe, thresholds.uv.danger);

        if (activeMode === 'risk') {
          displayValues[i] = (rTemp * w.temp) + (rPM25 * w.pm25) + (rNoise * w.noise) + (rUV * w.uv);
        } else if (activeMode === 'temp') {
          displayValues[i] = rTemp;
        } else if (activeMode === 'noise') {
          displayValues[i] = rNoise;
        } else if (activeMode === 'pm25') {
          displayValues[i] = rPM25;
        } else if (activeMode === 'uv') {
          displayValues[i] = rUV;
        }
      }

      renderCanvasOverlay(currentDailyData, displayValues);
    }

    function renderCanvasOverlay(dailyObj, riskArray) {
      if (canvasLayer) map.removeLayer(canvasLayer);

      const bounds = parseBounds(dailyObj.bbox);
      if (!bounds) {
        updateStatus(`Invalid bbox coordinate bounds in JSON`);
        return;
      }

      // Automatically fit map view to bounds on initial load
      if (!window.mapFitted) {
        map.fitBounds(bounds);
        window.mapFitted = true;
      }

      let rows = dailyObj.rows || dailyObj.nrows || dailyObj.height;
      let cols = dailyObj.cols || dailyObj.ncols || dailyObj.width;

      if (!rows || !cols) {
        cols = Math.round(Math.sqrt(riskArray.length));
        rows = Math.round(riskArray.length / cols);
      }

      const canvas = document.createElement('canvas');
      canvas.width = cols; 
      canvas.height = rows;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(cols, rows);

      let maxVal = 0;

      for (let i = 0; i < riskArray.length; i++) {
        const score = riskArray[i];
        if (score > maxVal) maxVal = score;
        const idx = i * 4;

        let r = 0, g = 0, b = 0;
        if (score < 0.5) {
          r = Math.round(255 * (score * 2));
          g = 220;
        } else {
          r = 235;
          g = Math.round(220 * (1 - (score - 0.5) * 2));
        }

        imgData.data[idx]     = r;
        imgData.data[idx + 1] = g;
        imgData.data[idx + 2] = b;
        imgData.data[idx + 3] = score > 0.01 ? 160 : 0; // Opacity
      }

      ctx.putImageData(imgData, 0, 0);
      canvasLayer = L.imageOverlay(canvas.toDataURL(), bounds, { opacity: 0.8 }).addTo(map);

      updateStatus(`Loaded OK | Grid: ${cols}x${rows} | Max Score: ${maxVal.toFixed(2)}`);
    }

    // Render Dynamic Markers
    function renderActiveEventMarkers(hour) {
      eventMarkersGroup.clearLayers();
      if (!currentDailyData) return;

      const hourData = getHourData(currentDailyData, hour) || {};
      const events = hourData.events || hourData.active_events || currentDailyData.active_events || {};

      Object.keys(events).forEach(key => {
        const ev = events[key];
        if (!ev.coords) return;

        let rawCoord = ev.coords;
        if (Array.isArray(rawCoord) && Array.isArray(rawCoord[0])) {
          rawCoord = rawCoord[0]; // Take centroid/first point if polygon
        }

        const pointBounds = parseBounds([rawCoord[0], rawCoord[1], rawCoord[0], rawCoord[1]]);
        if (!pointBounds) return;

        const latLng = pointBounds[0];

        const isMitigation = ev.type === 'mitigation' || ev.effect_type === 'mitigation';
        const color = isMitigation ? '#007bff' : '#e74c3c';
        const icon = isMitigation ? '❄️' : '⚠️';

        const marker = L.circleMarker(latLng, {
          radius: 9,
          fillColor: color,
          color: '#ffffff',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        });

        marker.bindPopup(`
          <div style="font-size:0.85rem; font-family:sans-serif;">
            <strong>${icon} ${ev.label || ev.id || key}</strong><br/>
            <span style="color:#666;">Type: ${isMitigation ? 'Cooling Center / Mitigation' : 'Hazard Event'}</span><br/>
            <span style="color:#666;">Hazards: ${ev.risks || 'Heat'}</span>
          </div>
        `);

        marker.bindTooltip(`${icon} ${ev.label || ev.id || key}`, { permanent: false, direction: 'top' });
        eventMarkersGroup.addLayer(marker);
      });
    }

    function togglePlay() {
      const btn = document.getElementById('playBtn');
      const slider = document.getElementById('hour');

      if (isPlaying) {
        clearInterval(playInterval);
        isPlaying = false;
        btn.innerText = "▶ Play 24h";
      } else {
        isPlaying = true;
        btn.innerText = "⏸ Pause";
        playInterval = setInterval(() => {
          let h = parseInt(slider.value) + 1;
          if (h > 23) h = 0;
          slider.value = h;
          updateFrame();
        }, 400);
      }
    }

    // Startup
    discoverAndPopulateDates();
  </script>
</body>
</html>
